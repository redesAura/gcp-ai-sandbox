name: terraform-ci

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - stages/0-bootstrap
          - stages/1-org
          - stages/2-security
          - modules/kms
          - modules/vpc-sc
          - modules/firewall
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      # fmt, tflint y checkov no revisan stages/3-networks: sigue siendo la copia sin adaptar
      # del template (enlaces simbólicos rotos y hallazgos de checkov). Quitar la excepción al adaptarla.
      - name: terraform fmt
        working-directory: ${{ matrix.dir }}
        run: terraform fmt -check -recursive

      - name: terraform init
        working-directory: ${{ matrix.dir }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.dir }}
        run: terraform validate

      - name: terraform test
        working-directory: ${{ matrix.dir }}
        run: terraform test

      - uses: terraform-linters/setup-tflint@v4

      - name: tflint
        working-directory: ${{ matrix.dir }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config "$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config "$GITHUB_WORKSPACE/.tflint.hcl"

      - name: checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          skip_path: stages/3-networks
          quiet: true
